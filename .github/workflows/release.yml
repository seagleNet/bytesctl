# Builds binaries for every platform. Pushing a tag like v0.2.0 also publishes them as a GitHub
# release; running the workflow by hand only builds them, as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, test: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, test: true }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          # Cross-compiled on Apple Silicon, so its tests can't run.
          - { target: x86_64-apple-darwin, os: macos-latest, test: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install the Rust target
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          name=bytesctl-${{ matrix.target }}
          mkdir -p dist "$name"
          cp README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/bytesctl.exe "$name/"
            7z a "dist/$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/bytesctl "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
